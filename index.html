<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>旅游城市人格测试</title>
    <meta name="description" content="11 道题，测出你的旅行城市人格——街巷烟火型、山海松弛型、历史审美型、异域探索型，并推荐 3 座适合你的城市。">
    <meta name="theme-color" content="#f4efe6">

    <link rel="icon" href="assets/icons/favicon.png" sizes="any">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">

    <meta property="og:type" content="website">
    <meta property="og:url" content="https://g88nr25ct5-sys.github.io/travel-city-personality-test/">
    <meta property="og:title" content="你的下一座城市，会在哪里？｜旅游城市人格测试">
    <meta property="og:description" content="11 道题，测出你的旅行城市人格，并推荐 3 座适合你的城市。">
    <meta property="og:image" content="https://g88nr25ct5-sys.github.io/travel-city-personality-test/assets/screenshots/og.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body data-screen="home">
    <!--
      首页装饰层：一根线挂照片 + 手绘简笔画（指南针 / 地标 / 旅行足迹）
      全部是手写 SVG，没有额外图片文件，颜色和线条都在 style.css 里统一控制。
      - 换照片：改下面 .photo img 的 src
      - 位置 / 大小 / 旋转：见 style.css 的「首页装饰层」一节
    -->
    <div class="scenery" aria-hidden="true">

        <!-- 一根线把照片挂起来 -->
        <div class="photo-line">
            <svg class="photo-line__wire" viewBox="0 0 640 40" preserveAspectRatio="none">
                <path d="M0 8 Q 320 34 640 8"></path>
            </svg>

            <div class="photo-line__items">
                <figure class="photo photo--1">
                    <img src="assets/cities/chengdu.jpg" alt="" width="118" height="148">
                </figure>

                <figure class="photo photo--2">
                    <img src="assets/cities/quanzhou.jpg" alt="" width="118" height="118">
                </figure>

                <figure class="photo photo--3">
                    <img src="assets/cities/dali.jpg" alt="" width="118" height="148">
                </figure>

                <figure class="photo photo--4">
                    <img src="assets/cities/datong.jpg" alt="" width="118" height="94">
                </figure>

                <figure class="photo photo--5">
                    <img src="assets/cities/kashi.jpg" alt="" width="118" height="148">
                </figure>
            </div>
        </div>

        <!-- 简笔画：指南针 -->
        <svg class="doodle doodle--compass" viewBox="0 0 100 100">
            <circle cx="50" cy="52" r="34" fill="none" stroke="currentColor" stroke-width="1.6"></circle>
            <circle cx="50" cy="52" r="26" fill="none" stroke="currentColor" stroke-width="0.8" opacity=".45"></circle>
            <g stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
                <line x1="50" y1="18" x2="50" y2="26"></line>
                <line x1="50" y1="78" x2="50" y2="86"></line>
                <line x1="16" y1="52" x2="24" y2="52"></line>
                <line x1="76" y1="52" x2="84" y2="52"></line>
            </g>
            <path d="M50 28 L57 52 L50 76 L43 52 Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path>
            <path d="M50 28 L57 52 L43 52 Z" fill="#b06a4a" opacity=".85"></path>
            <circle cx="50" cy="52" r="3.2" fill="currentColor"></circle>
            <text x="50" y="12" text-anchor="middle" font-size="10" fill="currentColor" font-family="Georgia, serif">N</text>
        </svg>

        <!-- 简笔画：地标（塔） -->
        <svg class="doodle doodle--pagoda" viewBox="0 0 120 110">
            <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
                <path d="M60 14 L60 4"></path>
                <path d="M48 22 Q60 13 72 22"></path>
                <path d="M53 22 L53 36 M67 22 L67 36"></path>
                <path d="M42 38 Q60 26 78 38"></path>
                <path d="M48 38 L48 54 M72 38 L72 54"></path>
                <path d="M34 56 Q60 40 86 56"></path>
                <path d="M42 56 L42 76 M78 56 L78 76"></path>
                <path d="M26 78 Q60 61 94 78"></path>
                <path d="M35 78 L35 94 M85 78 L85 94"></path>
                <path d="M24 94 L96 94"></path>
            </g>
            <circle cx="60" cy="9" r="2.4" fill="#b06a4a"></circle>
        </svg>

        <!-- 简笔画：旅行足迹（绕圈的虚线路线） -->
        <svg class="doodle doodle--route" viewBox="0 0 640 160">
            <path class="route-path" d="M12 120 C21.7 114.3 52.0 87.3 70 86 C88.0 84.7 104.2 115.7 120 112 C135.8 108.3 149.2 66.7 165 64 C180.8 61.3 200.8 98.0 215 96 C229.2 94.0 238.8 52.7 250 52 C261.2 51.3 281.7 79.7 282 92 C282.3 104.3 262.3 125.0 252 126 C241.7 127.0 218.3 106.0 220 98 C221.7 90.0 245.0 82.7 262 78 C279.0 73.3 303.7 68.7 322 70 C340.3 71.3 354.5 104.7 372 110 C389.5 115.3 413.8 71.3 430 62 C446.2 52.7 472.5 78.3 500 86 C527.5 93.7 549.5 49.3 566 44 C582.5 38.7 610.5 55.0 628 58"></path>
            <circle class="route-start" cx="12" cy="120" r="4.5"></circle>
            <g class="route-plane" transform="translate(604 34) rotate(18)">
                <path d="M0 8 L20 -1 L12 17 L9 10 Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path>
                <path d="M9 10 L20 -1" stroke="currentColor" stroke-width="1.2" fill="none"></path>
            </g>
        </svg>

        <!-- 简笔画：回形针 -->
        <svg class="doodle doodle--clip" viewBox="0 0 32 52">
            <path d="M16 6 v30 a8 8 0 0 1 -16 0 V12 a5.5 5.5 0 0 1 11 0 v24 a3 3 0 0 1 -6 0 V14"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>

        <!-- 小星点 -->
        <svg class="doodle doodle--sparkle doodle--sparkle-1" viewBox="0 0 24 24">
            <path d="M12 2 C13 8 16 11 22 12 C16 13 13 16 12 22 C11 16 8 13 2 12 C8 11 11 8 12 2 Z"
                  fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path>
        </svg>

        <svg class="doodle doodle--sparkle doodle--sparkle-2" viewBox="0 0 24 24">
            <path d="M12 2 C13 8 16 11 22 12 C16 13 13 16 12 22 C11 16 8 13 2 12 C8 11 11 8 12 2 Z"
                  fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path>
        </svg>

        <svg class="doodle doodle--sparkle doodle--sparkle-3" viewBox="0 0 24 24">
            <path d="M12 2 C13 8 16 11 22 12 C16 13 13 16 12 22 C11 16 8 13 2 12 C8 11 11 8 12 2 Z"
                  fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"></path>
        </svg>
    </div>

    <main class="page">
        <section id="home-screen" class="screen">
            <h1>
                你的下一座城市，
                <span>会在哪里？</span>
            </h1>

            <p class="subtitle">旅游城市人格测试</p>

            <p class="intro">发现最适合你的旅行城市。</p>

            <button type="button" id="start-btn">开始测试</button>
        </section>

        <section id="quiz-screen" class="screen quiz-screen is-hidden">
            <div class="quiz-head">
                <p class="kicker" id="quiz-progress">问题 1 / 11</p>
                <div class="quiz-bar" aria-hidden="true">
                    <span id="quiz-progress-fill"></span>
                </div>
            </div>

            <div class="quiz-body">
                <h2 class="question-text" id="question-text"></h2>
                <div class="answers" id="answers"></div>
            </div>

            <div class="quiz-foot">
                <button type="button" id="next-btn" disabled>下一题</button>
            </div>
        </section>

        <!-- 结果页内容由 script.js 生成 -->
        <section id="done-screen" class="screen done-screen is-hidden"></section>
    </main>

    <script src="script.js"></script>
</body>

</html>
